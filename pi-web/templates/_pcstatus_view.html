    <!-- ============ VIEW: PC STATUS ============ -->
    <div class="view flex-1 flex-col overflow-y-auto" data-view="pc">
      <header class="flex items-center justify-between gap-2 px-4 lg:px-7 py-3 lg:py-3.5 border-b sticky top-0 z-10" style="border-color: var(--line); background: var(--bg);">
        <div class="flex items-center gap-3 min-w-0">
          <button class="sidebarToggle lg:hidden p-1.5 -ml-1.5 rounded-md hover:bg-black/5 shrink-0" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color: var(--ink);"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="min-w-0">
            <h1 class="serif text-[17px] lg:text-[19px] font-medium leading-none" style="color: var(--ink);">État du système</h1>
            <div id="pcSubHeader" class="text-[11px] mt-1" style="color: var(--ink-3);">—</div>
          </div>
        </div>
        <button id="refreshPc" class="btn-ghost rounded-lg px-3 py-2 text-[12px] flex items-center gap-1.5 shrink-0">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          <span class="hidden sm:inline">Actualiser</span>
        </button>
      </header>
      <div class="max-w-4xl mx-auto w-full px-4 lg:px-7 py-6 space-y-5">
        <!-- ☠ Quotas et machine sur UNE page : ce sont les deux moitiés d'une
             même question — « est-ce que je peux lancer une équipe maintenant ? ».
             Les séparer obligeait à ouvrir deux écrans pour y répondre. -->
        <div id="pcQuotas"></div>

        <!-- ☠ UNE CARTE PAR MACHINE DE TRAVAIL (01/08). Les quatre tuiles fixes
             CPU/Mémoire/Temp/Disque qui vivaient ici ne décrivaient qu'UNE
             machine — celle joignable en LAN — et n'avaient plus de sens dès
             qu'il y en a eu deux. Le rendu est en JS parce que le nombre de
             machines n'est pas connu à l'écriture du gabarit : il dépend de
             qui s'est rattaché au Pi. -->
        <div id="pcMachines" class="space-y-4"></div>
      </div>
    </div>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ccremote — Connexion</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0a; color: #e8e8e8;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.card {
  background: #141414; border: 1px solid #242424;
  border-radius: 20px; padding: 32px 28px; width: 100%; max-width: 340px;
}
.title { font-size: 17px; font-weight: 700; letter-spacing: 0.08em; color: #fff; margin-bottom: 6px; }
.sub { font-size: 13px; color: #666; margin-bottom: 28px; }
label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #666; display: block; margin-bottom: 8px; }
input {
  width: 100%; background: #1c1c1c; border: 1px solid #2e2e2e; color: #e8e8e8;
  border-radius: 12px; padding: 14px 16px; font-size: 15px; outline: none;
  transition: border-color 0.15s;
}
input:focus { border-color: #444; }
button {
  width: 100%; background: #22c55e; color: #000; border: none;
  border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 16px; transition: filter 0.15s;
}
button:active { filter: brightness(0.9); }
.error { color: #f87171; font-size: 13px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="title">CCREMOTE</div>
  <div class="sub">Panneau de contrôle</div>
  <form method="post" action="/login">
    <label>Mot de passe</label>
    <input type="password" name="password" placeholder="••••••••" autofocus autocomplete="current-password">
    <button type="submit">Connexion</button>
  </form>
</div>
</body>
</html>

<!-- ====== MODALE HARNESS : arrêt d'urgence (H-57 — geste armé, pas un clic) ====== -->
<div id="modalHStop" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
  <div class="modal-in rounded-2xl border w-full max-w-sm mx-4 overflow-hidden" style="border-color: var(--err); background: var(--card);">
    <div class="px-6 pt-5 pb-4">
      <h3 class="serif text-[16px] font-medium mb-2" style="color: var(--err);">Arrêt d'urgence</h3>
      <p id="hStopDesc" class="text-[12.5px] leading-relaxed" style="color: var(--ink-2);">Pause globale, puis fermeture des sessions actives. Le contexte est préservé sur disque mais devra être rechargé.</p>
      <div class="text-[11.5px] mt-2" style="color: var(--ink-3);">Aucun travail non commité n'est détruit : les worktrees restent intacts.</div>
      <div class="arm-track" id="hArmTrack">
        <div class="arm-fill" id="hArmFill"></div>
        <div class="arm-label" id="hArmLabel">Maintenir 1,5 s pour armer</div>
      </div>
    </div>
    <div class="px-6 py-4 flex justify-end gap-2" style="background: var(--bg);">
      <button class="btn-ghost rounded-lg px-4 py-2 text-[12.5px] font-medium" data-close-modal>Annuler</button>
    </div>
  </div>
</div>

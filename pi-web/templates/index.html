<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ccremote</title>
<style>
:root[data-theme="dark"] {
  --bg:         #0a0a0a;
  --bg2:        #141414;
  --bg3:        #1c1c1c;
  --bg4:        #242424;
  --border:     #242424;
  --border2:    #2e2e2e;
  --text:       #e8e8e8;
  --text2:      #888;
  --text3:      #444;
  --accent:     #ffffff;
  --green:      #22c55e;
  --green-glow: #22c55e44;
  --red:        #ef4444;
  --red-bg:     #1a0a0a;
  --red-text:   #f87171;
  --amber:      #f59e0b;
  --blue:       #3b82f6;
  --bar-bg:     rgba(14,14,14,0.88);
  --chart-grid: rgba(255,255,255,0.04);
}
:root[data-theme="light"] {
  --bg:         #f2f2f7;
  --bg2:        #ffffff;
  --bg3:        #f0f0f0;
  --bg4:        #e8e8e8;
  --border:     #e0e0e0;
  --border2:    #d0d0d0;
  --text:       #111;
  --text2:      #666;
  --text3:      #bbb;
  --accent:     #000;
  --green:      #16a34a;
  --green-glow: #16a34a33;
  --red:        #dc2626;
  --red-bg:     #fef2f2;
  --red-text:   #dc2626;
  --amber:      #d97706;
  --blue:       #2563eb;
  --bar-bg:     rgba(242,242,247,0.88);
  --chart-grid: rgba(0,0,0,0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  overflow: hidden;
}

svg { display: block; flex-shrink: 0; }

/* ── TOP BAR ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  height: calc(52px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  background: var(--bar-bg);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border);
}
.topbar-title { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text2); transition: background 0.15s;
}
.icon-btn:active { background: var(--bg4); }

/* ── SCROLL AREA ── */
.content {
  position: fixed;
  top: calc(52px + env(safe-area-inset-top));
  left: 0; right: 0;
  bottom: calc(56px + env(safe-area-inset-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.page { display: none; padding: 16px; }
.page.active { display: block; }

/* ── BOTTOM TAB BAR ── */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  display: flex;
  height: calc(56px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--bar-bg);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-top: 1px solid var(--border);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px;
  color: var(--text3); font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase;
  cursor: pointer; transition: color 0.15s; user-select: none;
  background: none; border: none; padding: 0; font-family: inherit;
  -webkit-appearance: none;
}
.tab svg { transition: color 0.15s; }
.tab.active { color: var(--green); }

/* ── SECTION LABEL ── */
.section-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text2);
  margin: 20px 0 8px;
}
.section-label:first-child { margin-top: 0; }

/* ── STATUS CARDS ── */
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.status-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px;
}
.status-card-label { font-size: 11px; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
.status-dot-row { display: flex; align-items: center; gap: 8px; }
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--bg4); flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}
.dot.on  { background: var(--green); box-shadow: 0 0 8px var(--green-glow); }
.dot.off { background: var(--red); }
.dot.idle { background: var(--text3); }
.status-value { font-size: 14px; font-weight: 600; }
.updated-row { text-align: center; font-size: 11px; color: var(--text3); margin: 10px 0 4px; }

/* ── ACTION GRID ── */
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.action-btn {
  background: var(--bg2); border: 1px solid var(--border2); color: var(--text);
  border-radius: 16px; padding: 18px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: background 0.15s; user-select: none;
}
.action-btn:active { background: var(--bg3); }
.action-btn.full { grid-column: 1 / -1; flex-direction: row; gap: 10px; padding: 14px; }
.action-btn.danger { border-color: var(--red); color: var(--red-text); background: var(--red-bg); }
.action-btn.danger:active { filter: brightness(1.1); }
.action-btn:disabled { opacity: 0.3; pointer-events: none; }
.action-icon { color: var(--text2); }
.action-btn.danger .action-icon { color: var(--red-text); }

/* ── SESSIONS LIST ── */
.session-row {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 8px; cursor: pointer;
  transition: background 0.15s;
}
.session-row:active { background: var(--bg3); }
.session-name { font-size: 14px; font-weight: 500; flex: 1; font-family: "SF Mono", "Fira Code", monospace; }
.session-meta { font-size: 11px; color: var(--text2); }
.session-actions { display: flex; gap: 8px; }
.sess-btn {
  background: var(--bg3); border: 1px solid var(--border2); color: var(--text2);
  border-radius: 8px; padding: 6px 10px; font-size: 12px;
  cursor: pointer; display: flex; align-items: center; gap: 4px;
  transition: background 0.15s;
}
.sess-btn:active { background: var(--bg4); }
.sess-btn.danger { border-color: var(--red); color: var(--red-text); }
.empty-state { text-align: center; color: var(--text2); font-size: 14px; padding: 40px 0; }

/* ── TERMINAL ── */
.terminal-header {
  display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
}
.session-select {
  flex: 1; background: var(--bg2); border: 1px solid var(--border2); color: var(--text);
  border-radius: 10px; padding: 10px 12px; font-size: 14px;
  font-family: "SF Mono", "Fira Code", monospace;
  appearance: none;
}
.terminal-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px;
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  font-size: 11px; line-height: 1.5; color: var(--text);
  height: 340px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
}
.terminal-input-row { display: flex; gap: 8px; margin-top: 10px; }
.terminal-input {
  flex: 1; background: var(--bg2); border: 1px solid var(--border2); color: var(--text);
  border-radius: 10px; padding: 12px 14px; font-size: 14px;
  font-family: "SF Mono", "Fira Code", monospace;
}
.terminal-input::placeholder { color: var(--text3); }
.send-btn {
  background: var(--green); color: #000; border: none;
  border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; gap: 6px;
}

/* ── RESOURCE CHARTS ── */
.metric-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px; margin-bottom: 12px;
}
.metric-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.metric-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text2); }
.metric-value { font-size: 22px; font-weight: 700; }
.metric-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.chart-wrap { height: 80px; position: relative; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: calc(68px + env(safe-area-inset-bottom));
  left: 50%; transform: translateX(-50%);
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 20px; padding: 8px 18px; font-size: 13px;
  opacity: 0; transition: opacity 0.2s; pointer-events: none;
  white-space: nowrap; z-index: 300;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <span class="topbar-title">CCREMOTE</span>
  <div class="icon-btn" onclick="toggleTheme()" id="theme-btn">
    <!-- moon icon default -->
    <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- DASHBOARD -->
  <div class="page active" id="page-home">
    <div class="section-label">Statut</div>
    <div class="status-grid">
      <div class="status-card">
        <div class="status-card-label">PC</div>
        <div class="status-dot-row">
          <div class="dot idle" id="dot-pc"></div>
          <div class="status-value" id="val-pc">—</div>
        </div>
      </div>
      <div class="status-card">
        <div class="status-card-label">Claude</div>
        <div class="status-dot-row">
          <div class="dot idle" id="dot-claude"></div>
          <div class="status-value" id="val-claude">—</div>
        </div>
      </div>
    </div>
    <div class="updated-row" id="updated">—</div>

    <div class="section-label">Actions</div>
    <div class="action-grid">
      <button class="action-btn" id="btn-wake" onclick="doWake()">
        <svg class="action-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
        Wake
      </button>
      <button class="action-btn" id="btn-launch" onclick="doAction('launch')">
        <svg class="action-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Launch
      </button>
      <button class="action-btn danger" id="btn-kill" onclick="doAction('kill')">
        <svg class="action-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        </svg>
        Kill
      </button>
      <button class="action-btn full" id="btn-refresh" onclick="refreshStatus()">
        <svg class="action-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        Actualiser
      </button>
    </div>
  </div>

  <!-- SESSIONS -->
  <div class="page" id="page-sessions">
    <div class="section-label">Sessions actives</div>
    <div id="sessions-list"><div class="empty-state">Chargement…</div></div>
  </div>

  <!-- TERMINAL -->
  <div class="page" id="page-terminal">
    <div class="terminal-header">
      <select class="session-select" id="term-session" onchange="loadTerminal()">
        <option value="">— Sélectionner une session —</option>
      </select>
      <div class="icon-btn" onclick="loadTerminal()" title="Rafraîchir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </div>
    </div>
    <div class="terminal-box" id="terminal-output">Sélectionner une session pour afficher l'output.</div>
    <div class="terminal-input-row">
      <input class="terminal-input" id="terminal-input" placeholder="Envoyer un input…" onkeydown="onInputKey(event)">
      <button class="send-btn" onclick="sendInput()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- RESOURCES -->
  <div class="page" id="page-resources">
    <div class="metric-card">
      <div class="metric-header">
        <div>
          <div class="metric-title">CPU</div>
          <div class="metric-value" id="m-cpu">—%</div>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart-cpu"></canvas></div>
    </div>
    <div class="metric-card">
      <div class="metric-header">
        <div>
          <div class="metric-title">RAM</div>
          <div class="metric-value" id="m-ram">—%</div>
          <div class="metric-sub" id="m-ram-sub">— / —</div>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart-ram"></canvas></div>
    </div>
    <div class="metric-card">
      <div class="metric-header">
        <div>
          <div class="metric-title">GPU</div>
          <div class="metric-value" id="m-gpu">—%</div>
          <div class="metric-sub" id="m-gpu-sub">— / —</div>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart-gpu"></canvas></div>
    </div>
    <div class="metric-card">
      <div class="metric-header">
        <div>
          <div class="metric-title">Réseau</div>
          <div class="metric-value" id="m-net">—</div>
          <div class="metric-sub" id="m-net-sub">↑ — ↓ —</div>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart-net-up"></canvas></div>
    </div>
  </div>

</div><!-- /content -->

<!-- BOTTOM TAB BAR -->
<div class="tabbar">
  <button class="tab active" id="tab-home" onclick="switchTab('home')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    Accueil
  </button>
  <button class="tab" id="tab-sessions" onclick="switchTab('sessions')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    Sessions
  </button>
  <button class="tab" id="tab-terminal" onclick="switchTab('terminal')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
    </svg>
    Terminal
  </button>
  <button class="tab" id="tab-resources" onclick="switchTab('resources')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    Ressources
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── THEME ──────────────────────────────────────────────
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('icon-moon').style.display = t === 'dark' ? 'block' : 'none';
  document.getElementById('icon-sun').style.display  = t === 'light' ? 'block' : 'none';
  localStorage.setItem('theme', t);
  if (activeTab === 'resources') redrawAllCharts();
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

// ── TABS ───────────────────────────────────────────────
let activeTab = 'home';
function switchTab(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  activeTab = name;
  if (name === 'sessions') loadSessions();
  if (name === 'terminal') loadSessionsList();
  if (name === 'resources') {
    startMetrics();
    setTimeout(redrawAllCharts, 60);
  }
}

// ── STATUS ─────────────────────────────────────────────
async function refreshStatus() {
  try {
    const d = await api('GET', '/api/status');
    setDot('pc', d.pc_online);
    document.getElementById('val-pc').textContent = d.pc_online ? 'En ligne' : 'Hors ligne';
    setDot('claude', d.claude_running);
    document.getElementById('val-claude').textContent = d.claude_running ? 'En cours' : 'Arrêté';
    document.getElementById('updated').textContent = 'Actualisé à ' + new Date().toLocaleTimeString();
  } catch {
    setDot('pc', null); setDot('claude', null);
  }
}

function setDot(id, state) {
  const el = document.getElementById('dot-' + id);
  el.className = 'dot ' + (state === true ? 'on' : state === false ? 'off' : 'idle');
}

async function doWake() {
  disableBtn('wake');
  await api('POST', '/api/wake');
  toast('Magic packet envoyé');
  reenable('wake');
}

async function doAction(cmd) {
  disableBtn(cmd);
  const d = await api('POST', '/api/' + cmd);
  toast(d.status || cmd);
  setTimeout(refreshStatus, 1500);
  reenable(cmd);
}

function disableBtn(id) { const b = document.getElementById('btn-' + id); if(b) b.disabled = true; }
function reenable(id) { const b = document.getElementById('btn-' + id); if(b) b.disabled = false; }

// ── SESSIONS ───────────────────────────────────────────
async function loadSessions() {
  const el = document.getElementById('sessions-list');
  el.innerHTML = '<div class="empty-state">Chargement…</div>';
  const d = await api('GET', '/api/sessions');
  if (!d.sessions || d.sessions.length === 0) {
    el.innerHTML = '<div class="empty-state">Aucune session active</div>';
    return;
  }
  el.innerHTML = d.sessions.map(s => `
    <div class="session-row">
      <div class="dot ${s.attached ? 'on' : 'idle'}"></div>
      <div style="flex:1">
        <div class="session-name">${s.name}</div>
        <div class="session-meta">${s.attached ? 'Attachée' : 'Détachée'}</div>
      </div>
      <div class="session-actions">
        <button class="sess-btn" onclick="viewSession('${s.name}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          Terminal
        </button>
        <button class="sess-btn danger" onclick="killSession('${s.name}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}

function viewSession(name) {
  switchTab('terminal');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-terminal').classList.add('active');
  loadSessionsList().then(() => {
    document.getElementById('term-session').value = name;
    loadTerminal();
  });
}

async function killSession(name) {
  await api('POST', `/api/kill?session=${encodeURIComponent(name)}`);
  toast(`Session ${name} arrêtée`);
  loadSessions();
}

// ── TERMINAL ───────────────────────────────────────────
let termInterval = null;

async function loadSessionsList() {
  const sel = document.getElementById('term-session');
  const current = sel.value;
  const d = await api('GET', '/api/sessions');
  sel.innerHTML = '<option value="">— Sélectionner —</option>';
  if (d.sessions) {
    d.sessions.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.name; opt.textContent = s.name;
      sel.appendChild(opt);
    });
    if (current) sel.value = current;
  }
}

function stripAnsi(str) {
  return str.replace(/\x1B\[[0-9;]*[mGKHF]/g, '');
}

async function loadTerminal() {
  const session = document.getElementById('term-session').value;
  if (!session) return;
  clearInterval(termInterval);
  const fetchOutput = async () => {
    if (activeTab !== 'terminal') { clearInterval(termInterval); return; }
    const d = await api('GET', `/api/capture?session=${encodeURIComponent(session)}`);
    const box = document.getElementById('terminal-output');
    const atBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 40;
    box.textContent = stripAnsi(d.output || '');
    if (atBottom) box.scrollTop = box.scrollHeight;
  };
  await fetchOutput();
  termInterval = setInterval(fetchOutput, 1500);
}

async function sendInput() {
  const session = document.getElementById('term-session').value;
  const input = document.getElementById('terminal-input');
  if (!session || !input.value.trim()) return;
  await api('POST', `/api/send?session=${encodeURIComponent(session)}`, { keys: input.value });
  input.value = '';
  setTimeout(loadTerminal, 300);
}

function onInputKey(e) { if (e.key === 'Enter') sendInput(); }

// ── RESOURCES (canvas natif, zéro dépendance) ──────────
const HIST_LEN = 60;
const hist = { cpu: [], ram: [], gpu: [], netUp: [] };
const CHART_COLORS = { cpu: '#3b82f6', ram: '#8b5cf6', gpu: '#f59e0b', netUp: '#22c55e' };
const CHART_CANVAS = { cpu: 'chart-cpu', ram: 'chart-ram', gpu: 'chart-gpu', netUp: 'chart-net-up' };

function pushHist(key, val) {
  hist[key].push(val);
  if (hist[key].length > HIST_LEN) hist[key].shift();
}

function drawSparkline(canvasId, data, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w === 0 || h === 0) return;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr; canvas.height = h * dpr;
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (data.length < 2) return;

  const pad = 2;
  const stepX = w / (HIST_LEN - 1);
  const yFor = v => h - pad - (Math.max(0, Math.min(100, v)) / 100) * (h - pad * 2);
  const startIdx = HIST_LEN - data.length;

  // remplissage dégradé
  ctx.beginPath();
  ctx.moveTo(startIdx * stepX, h);
  data.forEach((v, i) => ctx.lineTo((startIdx + i) * stepX, yFor(v)));
  ctx.lineTo((startIdx + data.length - 1) * stepX, h);
  ctx.closePath();
  ctx.fillStyle = color + '22';
  ctx.fill();

  // ligne
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = (startIdx + i) * stepX, y = yFor(v);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function redrawAllCharts() {
  drawSparkline(CHART_CANVAS.cpu,   hist.cpu,   CHART_COLORS.cpu);
  drawSparkline(CHART_CANVAS.ram,   hist.ram,   CHART_COLORS.ram);
  drawSparkline(CHART_CANVAS.gpu,   hist.gpu,   CHART_COLORS.gpu);
  drawSparkline(CHART_CANVAS.netUp, hist.netUp, CHART_COLORS.netUp);
}

let metricsInterval = null;

function startMetrics() {
  if (metricsInterval) return;
  fetchMetrics();
  metricsInterval = setInterval(() => {
    if (activeTab !== 'resources') { clearInterval(metricsInterval); metricsInterval = null; return; }
    fetchMetrics();
  }, 2000);
}

async function fetchMetrics() {
  const d = await api('GET', '/api/metrics');

  if (!d || !d.pc_online) {
    ['m-cpu','m-ram','m-gpu','m-net'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = '—';
    });
    return;
  }

  document.getElementById('m-cpu').textContent = d.cpu + '%';
  document.getElementById('m-ram').textContent = d.mem_percent + '%';
  document.getElementById('m-ram-sub').textContent = `${d.mem_used_mb} MB / ${d.mem_total_mb} MB`;
  document.getElementById('m-gpu').textContent = d.gpu_util + '%';
  document.getElementById('m-gpu-sub').textContent = `${d.gpu_mem_used_mb} MB / ${d.gpu_mem_total_mb} MB`;
  const netTotal = (d.net_up_kb + d.net_down_kb).toFixed(1);
  document.getElementById('m-net').textContent = netTotal + ' KB/s';
  document.getElementById('m-net-sub').textContent = `↑ ${d.net_up_kb} KB/s  ↓ ${d.net_down_kb} KB/s`;

  pushHist('cpu', d.cpu);
  pushHist('ram', d.mem_percent);
  pushHist('gpu', d.gpu_util);
  pushHist('netUp', Math.min(100, (d.net_up_kb / 1024) * 100));
  redrawAllCharts();
}

// ── API HELPER ─────────────────────────────────────────
async function api(method, path, body) {
  try {
    const opts = { method, headers: {}, credentials: 'include' };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(path, opts);
    if (!r.ok) return { pc_online: false };
    return await r.json();
  } catch { return { pc_online: false }; }
}

// ── TOAST ──────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ── INIT ───────────────────────────────────────────────
applyTheme(localStorage.getItem('theme') || 'dark');
refreshStatus();
setInterval(() => { if (activeTab === 'home') refreshStatus(); }, 8000);
setInterval(() => { if (activeTab === 'sessions') loadSessions(); }, 10000);

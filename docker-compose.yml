# ccremote — déploiement local, tout en Linux.
#
# Répartition cible : `web` ira sur le Mac, `sessions` reste sur la machine qui héberge les
# modèles. Pour l'instant les deux tournent ici, ce qui permet de valider la chaîne complète
# avant de la répartir. Passer à la cible ne demandera que de changer PC_HOST et AGENT_BASE_URL.
services:

  # Interface web et agent IA. Le seul composant exposé à l'utilisateur.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: ccremote:web
    container_name: ccremote-web
    restart: unless-stopped

    ports:
      - "8080:8000"

    environment:
      # Serveur de sessions : le conteneur voisin de cette composition.
      - PC_HOST=sessions
      - PC_PORT=8765
      - PC_MAC=${PC_MAC:-}

      # Modèles locaux servis par EchoHub sur l'hôte. `host.docker.internal` est résolu par
      # l'entrée extra_hosts ci-dessous — depuis un conteneur, `localhost` désigne le
      # conteneur lui-même, jamais la machine.
      - AGENT_BASE_URL=${AGENT_BASE_URL:-http://host.docker.internal:37821/v1}
      - AGENT_API_KEY=${AGENT_API_KEY:-local}
      # Vide = le premier modèle annoncé par /v1/models est retenu, c'est-à-dire celui qui est
      # réellement chargé sur le PC à cet instant.
      - AGENT_MODEL=${AGENT_MODEL:-}

      - UI_USER=${UI_USER:-chris}
      - UI_PASSWORD=${UI_PASSWORD:?UI_PASSWORD doit etre defini dans .env}

      # Plan de contrôle du harness — alimente les panneaux « Pi » et « control plane ».
      # Sur 127.0.0.1 : le conteneur `harness` partage la pile réseau de celui-ci
      # (network_mode ci-dessous), les deux processus se voient donc en boucle locale.
      - HARNESS_API_URL=http://127.0.0.1:8722

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - sessions

  # Plan de contrôle du harness : registre des missions, permissions, projets, quotas.
  # Autorité du système — `web` l'interroge, il ne décide rien lui-même.
  harness:
    build:
      context: .
      dockerfile: docker/Dockerfile.harness
    image: ccremote:harness
    container_name: ccremote-harness
    restart: unless-stopped

    # Partage la pile réseau de `web`. L'API du harness n'a AUCUNE authentification propre et
    # refuse délibérément d'écouter sur une adresse publique (serveur-api.ts) : c'est pi-web
    # qui l'expose et l'authentifie. Plutôt que de contourner ce garde-fou, on donne aux deux
    # processus la même boucle locale — exactement la topologie pour laquelle il a été écrit.
    # Conséquence : ce service ne publie pas de ports, il hérite de ceux de `web`.
    network_mode: "service:web"

    volumes:
      # Registre SQLite, identité de l'orchestrateur, projets : doivent survivre au conteneur.
      - ccremote_harness:/var/lib/ccremote

    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CCREMOTE_LIEN_SECRET=${CCREMOTE_LIEN_SECRET:?CCREMOTE_LIEN_SECRET doit etre defini dans .env}
      # Le canal de liaison écoute sur toutes les interfaces : contrairement à l'API web, il
      # est authentifié par secret partagé (fermeture 4401 si invalide), donc exposable aux
      # machines de travail — c'est sa raison d'être.
      - CCREMOTE_LIEN_HOST=0.0.0.0
      - CCREMOTE_LIEN_PORT=8721
      - CCREMOTE_API_WEB_PORT=8722
      - CCREMOTE_PI_REGISTRE_DB=/var/lib/ccremote/pi/registre.sqlite
      - CCREMOTE_PI_IDENTITE_ORCHESTRATEUR=/var/lib/ccremote/pi/identite-orchestrateur.json
      - CCREMOTE_PI_INCIDENTS_ORCHESTRATEUR=/var/lib/ccremote/pi/incidents-orchestrateur.jsonl
      - CCREMOTE_PI_REPERTOIRE_PROJETS=/var/lib/ccremote/pi/projets

  # Serveur de sessions : tmux, métriques, pilotage. Autorité sur l'état réel.
  sessions:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: ccremote:sessions
    container_name: ccremote-sessions
    restart: unless-stopped

    # Port publié pour permettre un diagnostic direct au websocket depuis l'hôte.
    ports:
      - "8765:8765"

    volumes:
      # Espace de travail des sessions, persistant hors du conteneur.
      - ccremote_workspace:/workspace

    environment:
      - WORKSPACE=/workspace

  # Superviseur de la machine de travail. C'est lui qui fait exister le « PC » aux yeux du
  # control plane : sans lui, toutes les routes du harness répondent « PC absent ».
  # Il n'exige aucune clé d'un fournisseur distant pour démarrer — le SDK n'intervient qu'au
  # spawn d'une session, ce que nous ne faisons pas ici.
  pc:
    build:
      context: .
      dockerfile: docker/Dockerfile.harness
    image: ccremote:harness
    container_name: ccremote-pc
    restart: unless-stopped

    command: ["bun", "run", "composition/pc/bin-pc.ts"]

    volumes:
      - ccremote_pc:/var/lib/ccremote

    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CCREMOTE_LIEN_SECRET=${CCREMOTE_LIEN_SECRET:?CCREMOTE_LIEN_SECRET doit etre defini dans .env}
      # Le PC initie toujours le lien, jamais l'inverse (contrat H-75). `web` porte le port
      # 8721 puisque `harness` partage sa pile réseau.
      - CCREMOTE_LIEN_URL_PI=ws://web:8721
      - CCREMOTE_PC_REGISTRE_DB=/var/lib/ccremote/pc/registre-workers.sqlite
      - CCREMOTE_MACHINE_ID=${CCREMOTE_MACHINE_ID:-pc-local}

    depends_on:
      - web

volumes:
  ccremote_workspace:
  ccremote_harness:
  ccremote_pc:

[package]
name = "ccremote"
version = "2.0.0"
description = "ccremote — sessions Claude Code du parc, depuis le bureau"
edition = "2021"

[lib]
name = "ccremote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 4
lto = "thin"
strip = true

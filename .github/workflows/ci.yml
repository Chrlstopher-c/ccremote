name: CI
on:
  push:
    branches: [dev, master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Dépendances (racine)
        run: bun install --frozen-lockfile
      - name: Types (racine)
        run: bun run typecheck
      - name: Tests
        run: bun test commun poste relais mcp
      - name: Dépendances (app)
        run: bun install --frozen-lockfile
        working-directory: bureau
      - name: Tests (app)
        run: bun test bureau/src
      - name: Types (app)
        run: bunx tsc --noEmit
        working-directory: bureau
  hq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Dépendances (Agent HQ)
        run: bun install --frozen-lockfile
        working-directory: hq
      - name: Types (Agent HQ)
        run: bun run typecheck
        working-directory: hq
      - name: Tests (Agent HQ)
        run: bun test src
        working-directory: hq
      - name: Build (Agent HQ)
        run: bun run build
        working-directory: hq

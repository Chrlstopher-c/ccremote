<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="382" viewBox="0 0 1040 382" fill="none" role="img">
  <defs><marker id="stp-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs>
  <rect width="1040" height="382" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="30" y="36" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" letter-spacing="2.5" fill="#59636e">DEPLOY, IN THE ORDER THE SCRIPTS ENFORCE</text>
  <rect x="30" y="56" width="478" height="139" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="56" cy="82" r="13" fill="#d8a35f"/>
  <text x="56" y="87" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="78" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">Pull and check the fleet is idle</text>
  <rect x="44" y="108" width="450" height="24" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="54" y="124" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11.5" fill="#9a6b1f">./deployer-tout.sh --simulation</text>
  <text x="44" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">git pull --ff-only on the PC, then a guard refuses to continue while a</text><text x="44" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">team is running. Drop --simulation to do it for real.</text><path d="M512 82 l16 0" stroke="#59636e" stroke-width="1.4" marker-end="url(#stp-light)"/>
  <rect x="532" y="56" width="478" height="139" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="558" cy="82" r="13" fill="#d8a35f"/>
  <text x="558" y="87" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="580" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">Raspberry Pi: control plane and web UI</text>
  <rect x="546" y="108" width="450" height="24" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="556" y="124" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11.5" fill="#9a6b1f">./deployer-pi.sh</text>
  <text x="546" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">rsync harness/ to /home/pi/ccremote-harness, scp pi-web/ to</text><text x="546" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">/home/pi/ccremote-web, install both systemd units.</text>
  <rect x="30" y="219" width="478" height="139" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="56" cy="245" r="13" fill="#d8a35f"/>
  <text x="56" y="250" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="78" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">PC: restart the supervisor</text>
  <rect x="44" y="271" width="450" height="24" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="54" y="287" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11.5" fill="#9a6b1f">./deploy-superviseur-pc.sh</text>
  <text x="44" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">No copy: the user unit ccremote-pc runs the repo in place. The script</text><text x="44" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">checks the process is newer than the sources.</text><path d="M512 245 l16 0" stroke="#59636e" stroke-width="1.4" marker-end="url(#stp-light)"/>
  <rect x="532" y="219" width="478" height="139" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="558" cy="245" r="13" fill="#d8a35f"/>
  <text x="558" y="250" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="580" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">VPS: fallback supervisor</text>
  <rect x="546" y="271" width="450" height="24" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="556" y="287" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11.5" fill="#9a6b1f">./deploy-superviseur-vps.sh --demarrer</text>
  <text x="546" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">rsync to /home/ubuntu/ccremote/harness, bun install,</text><text x="546" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">~/.config/ccremote/pc.env, user unit ccremote-pc. Without --demarrer</text><text x="546" y="343" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#59636e">nothing starts.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="232" viewBox="0 0 1040 232" fill="none" role="img">
  <rect width="1040" height="232" rx="16" fill="#0a0b0e" stroke="#20242c"/>
  <text x="30" y="36" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" letter-spacing="2.5" fill="#8b929c">WHICH MODEL DOES WHAT</text>
  <rect x="30" y="56" width="313.3333333333333" height="152" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="48" y="106" font-family="Georgia,'Times New Roman',serif" font-size="38" font-weight="600" fill="#f4f1ea">Opus</text>
  <text x="48" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">the orchestrator you talk to, one session for</text><text x="48" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">every thread</text>
  <text x="48" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">options-orchestrateur.ts</text>
  <rect x="363.3333333333333" y="56" width="313.3333333333333" height="152" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="381.3333333333333" y="106" font-family="Georgia,'Times New Roman',serif" font-size="38" font-weight="600" fill="#f4f1ea">Opus 5<tspan font-size="16" fill="#8b929c"> high</tspan></text>
  <text x="381.3333333333333" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">team leads by default, arbitrated per mandate</text>
  <text x="381.3333333333333" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">6.40 $ per team, against 0.67 $ on Sonnet</text>
  <rect x="696.6666666666666" y="56" width="313.3333333333333" height="152" rx="12" fill="#161b22" stroke="#2a313c"/>
  <text x="714.6666666666666" y="106" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="600" fill="#f4f1ea">Haiku 4.5</text>
  <text x="714.6666666666666" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">judges loop or progress, and extracts the</text><text x="714.6666666666666" y="149" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c3cad3">lessons</text>
  <text x="714.6666666666666" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">max 5 lessons, 1 200 characters, pushed</text><text x="714.6666666666666" y="187" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#8b929c">into the next mandate</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="582" viewBox="0 0 1040 582" fill="none" role="img">
  <rect width="1040" height="582" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="30" y="24" width="980" height="136" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="46" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#59636e">BEFORE A TEAM STARTS</text>
  <path d="M56 66 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="79" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">fuel guard</text>
    <text x="500" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">refuses a mandate built on a quota reading older than 30 minutes</text>
  <path d="M56 96 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="109" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">wave guard</text>
    <text x="500" y="109" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">refuses one more identical wave within 24 hours</text>
  <path d="M56 126 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="139" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">fleet ceiling</text>
    <text x="500" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">refuses a new mission when an account is rejected or past its threshold</text>
  <rect x="30" y="178" width="980" height="196" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="200" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#59636e">WHILE IT RUNS</text>
  <path d="M56 220 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="233" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">plancher-deni</text>
    <text x="500" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">16 Bash patterns refused in every permission mode, bypass included</text>
  <rect x="48" y="252" width="16" height="14" rx="4" fill="none" stroke="#d8a35f" stroke-width="1.4"/><circle cx="53" cy="258" r="1.4" fill="#d8a35f"/><circle cx="59" cy="258" r="1.4" fill="#d8a35f"/>
    <text x="76" y="263" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">anti-boucle</text>
    <text x="500" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">a Haiku judge rules progress or loop at cost milestones; doubt never means loop</text>
  <path d="M56 280 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="293" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">budget</text>
    <text x="500" y="293" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">spending ceiling per team, set at the mandate or adjusted later</text>
  <path d="M56 310 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="323" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">autonomy window</text>
    <text x="500" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">a window lasts 5 minutes to 14 days, with a ceiling of teams that may start alone</text>
  <path d="M56 340 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="353" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">pause</text>
    <text x="500" y="353" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">marks the team paused before interrupting; queued messages are never lost or replayed</text>
  <rect x="30" y="392" width="980" height="166" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="414" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#59636e">WHEN SOMETHING DIES</text>
  <path d="M56 434 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="447" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">fencing by epoch</text>
    <text x="500" y="447" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">a stale epoch is rejected, and on a tie the newcomer always loses</text>
  <path d="M56 464 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="477" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">process revalidation</text>
    <text x="500" y="477" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">reads the start time in /proc, so a recycled pid is not mistaken for a live worker</text>
  <path d="M56 494 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="507" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">emergency stop</text>
    <text x="500" y="507" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">a recurring drill kills a real canary process by exact pid, never by name pattern</text>
  <path d="M56 524 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="537" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">relance</text>
    <text x="500" y="537" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">retries transient failures with backoff, escalates structural ones instead</text>
</svg>
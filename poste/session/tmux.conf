# Serveur tmux dédié aux Claude (`tmux -L claude`), identique à celui de relais : les sessions du bureau, d'Atrium
# et de ccremote sont les mêmes, attachables de plusieurs écrans à la fois.
set -g status off
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g window-size latest
setw -g aggressive-resize on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys,xterm-256color:RGB"
set -g extended-keys on
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#{pane_title}"
